<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ヒグマ襲来 - 緊急通知</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/lose.css}">
</head>
<body>

  <div th:replace="~{layout/_header :: header}"></div>

  <main class="main-content">
    <div class="lose-wrapper">
      <div class="lose-card">
        <h1 class="lose-title">🐻 ヒグマ出現！！ 🐻</h1>
        <img th:src="@{/image/bear.png}" alt="ヒグマ" class="lose-bear-img">
        <p class="lose-subtitle">
          カートの商品が奪われました…<br>
          （北海道ではよくあることです。）
        </p>
        <div class="lose-btn">
          <form th:action="@{/home}" method="get">
            <button type="submit" class="btn btn-primary">
              商品一覧へ戻る
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
