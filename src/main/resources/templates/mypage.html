<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>マイページ</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: "Yu Gothic", sans-serif;
			background: linear-gradient(180deg, #f6f8f3 0%, #ffffff 100%);
			color: #3b3b3b;
		}

		.mypage-container {
			width: 90%;
			max-width: 760px;
			margin: 60px auto;
			background: #ffffffcc;
			backdrop-filter: blur(6px);
			border-radius: 26px;
			padding: 48px;
			border: 1px solid #e8efe3;
			box-shadow: 0 10px 30px rgba(60, 80, 60, 0.08);
		}

		h1 {
			text-align: center;
			margin-bottom: 40px;
			font-size: 30px;
			letter-spacing: 2px;
			color: #4a614a;
			font-weight: 600;
		}

		.user-info {
			background: linear-gradient(135deg, #f3f7f0, #ffffff);
			border: 1px solid #dde7d8;
			border-radius: 18px;
			padding: 22px 26px;
			margin-bottom: 36px;
			line-height: 2;
			color: #4b4b4b;
		}

		.user-info strong {
			color: #5c7a5c;
		}

		.menu-list {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.menu-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			text-decoration: none;
			color: #3d3d3d;
			background: #fbfcfa;
			padding: 18px 22px;
			border-radius: 14px;
			border: 1px solid #e6eee2;
			transition: 0.2s ease;
			font-size: 15.5px;
		}

		.menu-item:hover {
			background: #f1f6ee;
			transform: translateY(-1px);
			border-color: #cfdcc9;
		}

		.arrow {
			color: #8aa38a;
		}

		/* ほんのり区切り感（自然UIっぽさ） */
		.menu-item + .menu-item {
			position: relative;
		}

		@media (max-width: 600px) {
			.mypage-container {
				padding: 26px;
				margin: 30px auto;
			}

			h1 {
				font-size: 24px;
			}
		}
	</style>
</head>

<body>
	<header th:replace="layout/_header :: header"></header>
	<div class="mypage-container">

		<h1>マイページ</h1>

		<!-- 登録情報 -->
		<div class="user-info">
			<div>
		 	 名前：<span th:text="${session.loginUser.name}"></span>
			</div>

			<div>
		  	メールアドレス：<span th:text="${session.loginUser.email}"></span>
			</div>
		</div>

		<!-- メニュー -->
		<div class="menu-list">

			<a href="#" class="menu-item">
				<span>注文履歴一覧</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>気になるカテゴリーの再選択</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>気になる地域の再選択</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>ヘルプ・よくある質問</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>アプリの機能に関するご意見・ご要望</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>北ノ味サービス利用規約</span>
				<span class="arrow">›</span>
			</a>

			<a href="#" class="menu-item">
				<span>プライバシーポリシー</span>
				<span class="arrow">›</span>
			</a>

		</div>

	</div>
	<footer th:replace="layout/_footer :: footer"></footer>
</body>

</html>
