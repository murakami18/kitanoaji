<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>北海道マップ</title>

<style>

/* 地図全体 */
.map-container {
    position: relative;
    width: 800px;
}

/* 地図画像 */
.map-container img {
    width: 100%;
}

/* 地域ボタン共通 */
.region-button {

    position: absolute;

    background-color: white;

    border: 2px solid burlywood;

    padding: 8px 16px;

    border-radius: 10px;

    text-decoration: none;

    color: saddlebrown;

    font-weight: bold;
}

/* マウスを乗せた時 */
.region-button:hover {
    background-color: #eeeeee;
}


/* ===== 地域ごとの位置 ===== */

/* 宗谷 */
.souya {
    top: 15px;
    left: 330px;
}

/* オホーツク */
.okhotsk {
    top: 170px;
    left: 450px;
}

/* 根室 */
.nemuro {
    top: 220px;
    left: 610px;
}

/* 釧路 */
.kushiro {
    top: 270px;
    left: 510px;
}

/* 十勝 */
.tokachi {
    top: 280px;
    left: 420px;
}

/* 日高 */
.hidaka {
    top: 360px;
    left: 350px;
}

/* 胆振 */
.iburi {
    top: 360px;
    left: 265px;
}

/* 渡島 */
.oshima {
    top: 440px;
    left: 230px;
}

/* 檜山 */
.hiyama {
    top: 430px;
    left: 110px;
}

/* 後志 */
.shiribeshi {
    top: 310px;
    left: 180px;
}

/* 石狩 */
.ishikari {
    top: 240px;
    left: 235px;
}

/* 空知 */
.sorachi {
    top: 240px;
    left: 307px;
}

/* 上川 */
.kamikawa {
    top: 180px;
    left: 360px;
}

/* 留萌 */
.rumoi {
    top: 85px;
    left: 270px;
}
</style>

</head>

<body>

<h1>北海道エリア一覧</h1>

<div class="map-container">

    <!-- 地図画像 -->
    <img src="/map_image/hokkaido.png" alt="北海道地図">

    <!-- 石狩 -->
    <a href="/home?regionId=1"
       class="region-button ishikari">
        石狩
    </a>

    <!-- 胆振 -->
    <a href="/home?regionId=2"
       class="region-button iburi">
        胆振
    </a>

    <!-- 渡島 -->
    <a href="/home?regionId=3"
       class="region-button oshima">

    <!-- オホーツク -->

       class="region-button okhotsk">

    </a>

    <!-- 上川 -->

    </a>

    <!-- 釧路 -->

       class="region-button kushiro">
        釧路
    </a>

    <!-- 後志 -->

       class="region-button shiribeshi">

    </a>

    <!-- 宗谷 -->

</html>
