<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご意見・ご要望ありがとうございました - 北ノ味</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.8;
            color: #333333;
            background-color: #f1f4f6; /* フォーム画面と合わせたスッキリした淡い背景 */
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 80px auto 0 auto; /* 少し上に余白を持たせる */
            background-color: #ffffff;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(21, 86, 102, 0.08);
            border-top: 6px solid #155a6a; /* 指定色「#155a6a」の太線アクセント */
            text-align: center; /* 中身をすべて中央寄せに */
        }
        
        /* かわいい笑顔のメッセージアイコン風SVG */
        .success-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 25px;
            stroke: #155a6a; /* 指定色 */
            fill: #e6f0f2; /* 指定色の薄い色 */
        }

        h1 {
            font-size: 24px;
            color: #155a6a; /* 指定色「#155a6a」 */
            margin-bottom: 15px;
            font-weight: 700;
        }
        .message-p {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 40px;
            font-weight: bold;
        }
        
        .btn-wrapper {
            text-align: center;
        }
        .home-btn {
            display: inline-block;
            width: 240px;
            padding: 15px 20px;
            background-color: #155a6a; /* 指定色 */
            color: #ffffff;
            text-decoration: none; /* リンクの下線を消す */
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(21, 86, 102, 0.2);
            transition: all 0.2s;
        }
        .home-btn:hover {
            background-color: #0e3e4a; /* ホバー時は少し暗めのトーン */
            box-shadow: 0 4px 14px rgba(21, 86, 102, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="container">
    
    <h1>送信が完了しました</h1>
    <p class="message-p">意見ありがとうございます！うれしいです</p>

    <div class="btn-wrapper">
        <a href="/home" class="home-btn">ホームに戻る</a>
    </div>
</div>

</body>
</html>
