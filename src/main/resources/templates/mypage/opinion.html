<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご意見・ご要望 - 北ノ味</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.8;
            color: #333333;
            background-color: #f1f4f6; /* 指定色に馴染むスッキリした淡い背景 */
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px 40px; /* 上下左右の余白を少し広げて上品な空間を確保 */
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(21, 86, 102, 0.05); /* 影をより柔らかく、現代的に */
            border-top: 6px solid #155a6a; /* 指定色「#155a6a」の太線アクセント */
        }
        h1 {
            font-size: 26px;
            color: #155a6a; /* 指定色「#155a6a」 */
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .subtitle {
            text-align: center;
            color: #5c7880;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 0.08em;
        }
        .intro-p {
            margin-bottom: 40px;
            font-size: 15px;
            color: #4a5568;
            background-color: #eef6f8; /* 指定色を極限まで薄めた爽やかな背景 */
            padding: 24px 20px;
            border-radius: 12px;
            border-left: 5px solid #155a6a; /* 指定色の左太線 */
            text-align: center;
        }
        
        /* ボタンを配置するコンテナ（PC時は絶対に横並び） */
        .btn-container {
            display: flex;
            flex-direction: row;      /* ボタンを横に並べる */
            flex-wrap: nowrap;        /* 絶対に折り返さない */
            justify-content: center;   /* 中央寄せ */
            align-items: center;      /* 縦方向の揃え位置を中央に */
            gap: 20px;                /* ボタン同士の横方向の間隔 */
            margin-top: 40px;
            margin-bottom: 10px;
            width: 100%;
        }

        /* 共通のボタンベーススタイル */
        .btn-base {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;                   /* 横幅を均等に分ける */
            max-width: 280px;          /* 大きくなりすぎない上限サイズ */
            min-width: 180px;          /* 縮みすぎない下限サイズ */
            white-space: nowrap;       /* ボタン内の文字を改行させない */
            font-weight: bold;
            font-size: 16px;
            border-radius: 30px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* メインの「ご意見・ご要望」ボタン */
        .btn-submit {
            padding: 16px 20px;
            background-color: #155a6a; /* ブランドカラー */
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(21, 86, 102, 0.25);
        }
        .btn-submit:hover {
            background-color: #1b7286;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(21, 86, 102, 0.35);
        }
        .btn-submit:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(21, 86, 102, 0.2);
        }

        /* サブの「プライバシーポリシー」ボタン（枠線デザイン） */
        .btn-privacy {
            padding: 14px 20px;         /* 枠線分パディングを調整して高さを統一 */
            background-color: transparent;
            color: #155a6a;
            border: 2px solid #155a6a;
        }
        .btn-privacy:hover {
            background-color: #eef6f8;  /* ホバー時にブランドの極薄背景色を敷く */
            transform: translateY(-3px); 
            box-shadow: 0 6px 16px rgba(21, 86, 102, 0.1);
        }
        .btn-privacy:active {
            transform: translateY(-1px);
        }

        /* スマートフォン用の余白・レイアウト調整 */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }
            .container {
                padding: 35px 20px;
            }
            h1 {
                font-size: 22px;
            }
            .intro-p {
                font-size: 14px;
                text-align: left;
                br { display: none; }
            }
            /* スマホでは縦並びに切り替え */
            .btn-container {
                flex-direction: column;
                flex-wrap: wrap;
                gap: 16px;
            }
            .btn-base {
                max-width: 100%; /* スマホでは画面幅いっぱいに広げる */
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
  <h1>ご意見・ご要望</h1>
  <div class="subtitle">北ノ味をいっしょに育てるメッセージ</div>

  <p class="intro-p">
    いつも「北ノ味」に美味しいお付き合いをいただき、ありがとうございます！<br>
    「ここが良かった！」「もっとこうして欲しいな」という声が、私たちの何よりの励みになります。<br>
    お名前やメールアドレスの入力は不要ですので、どうぞお気軽にあなたの声をお聞かせください。
  </p>

  <div class="btn-container">
    <!-- メインボタン: ご意見・ご要望 -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSei7Ct8fQSlLLTYCZqCCDrvU-I9dz819MDrIMv40SupNr1bYw/viewform?usp=header" class="btn-base btn-submit" target="_blank" rel="noopener noreferrer">
      <span>ご意見・ご要望フォーム</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>

    <!-- サブボタン: プライバシーポリシー -->
    <a href="/mypage/privacy_policy" class="btn-base btn-privacy">
      <span>プライバシーポリシー</span>
    </a>
  </div>
</div>

</body>
</html>
