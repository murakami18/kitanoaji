<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>マイページ</title>
	<!-- 共通スタイルシート -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<!-- マイページ専用スタイルシート -->
	<link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>
	<!-- 共通ヘッダー -->
	<header th:replace="layout/_header :: header"></header>

	<!-- 共通のメインコンテンツ枠（style.cssの .main-content を適用） -->
	<main class="main-content">
		<div class="mypage-container">

			<h1 class="mypage-title">マイページ</h1>

			<!-- 登録情報 -->
			<div class="user-info-box">
				<div class="user-info-row">
					<span class="user-info-label">名前</span>
					<span class="user-info-value" th:text="${session.loginUser.name}"></span>
				</div>

				<div class="user-info-row">
					<span class="user-info-label">メールアドレス</span>
					<span class="user-info-value" th:text="${session.loginUser.email}"></span>
				</div>
			</div>

			<!-- メニューリスト -->
			<div class="mypage-menu-list">

				<a href="/mypage/history" class="mypage-menu-item">
				    <span>注文履歴一覧</span>
				    <span class="mypage-menu-arrow">›</span>
				</a>

				<a href="#" class="mypage-menu-item">
					<span>気になるカテゴリーの再選択</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

				<a href="#" class="mypage-menu-item">
					<span>気になる地域の再選択</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

				<a href="#" class="mypage-menu-item">
					<span>ヘルプ・よくある質問</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

				<a href="/mypage/opinion" class="mypage-menu-item">
					<span>アプリの機能に関するご意見・ご要望</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

				<a href="/mypage/terms_of_service" class="mypage-menu-item">
					<span>北ノ味サービス利用規約</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

				<a href="/mypage/privacy_policy" class="mypage-menu-item">
					<span>プライバシーポリシー</span>
					<span class="mypage-menu-arrow">›</span>
				</a>

			</div>

		</div>
	</main>
</body>

</html>
