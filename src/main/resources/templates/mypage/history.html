<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>注文履歴</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="layout/_header :: header"></header>

  <main>
    <h1>注文履歴</h1>

    <!-- 履歴が空、またはデータ自体が渡されなかった(null)場合 -->
    <p th:if="${historyRows == null || #lists.isEmpty(historyRows)}">購入履歴はまだありません。</p>

    <!-- 履歴が存在する場合（nullでなく、かつ空でない場合） -->
    <table th:unless="${historyRows == null || #lists.isEmpty(historyRows)}" border="1" cellpadding="8">
      <thead>
        <tr>
          <th>注文番号</th>
          <th>注文日時</th>
          <th>商品名</th>
          <th>単価</th>
          <th>数量</th>
          <th>小計</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${historyRows}">
          <!-- 1. 注文番号 -->
          <td th:text="${row.orderId}">注文番号</td>
          
          <!-- 2. 注文日時 -->
          <td th:text="${#temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm')}">注文日時</td>
          
          <!-- 3. 商品名 -->
          <td th:text="${row.productName}">商品名</td>
          
          <!-- 4. 単価 -->
          <td th:text="${#numbers.formatInteger(row.price, 3, 'COMMA')} + '円'">単価</td>
          
          <!-- 5. 数量 -->
          <td th:text="${row.quantity}">数量</td>
          
          <!-- 6. 小計 -->
          <td th:text="${#numbers.formatInteger(row.subtotal, 3, 'COMMA')} + '円'">小計</td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
