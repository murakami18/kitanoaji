<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>注文履歴</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/history.css}">
</head>
<body>
  <header th:replace="layout/_header :: header"></header>

  <main class="main-content">

    <h1 class="history-title">注文履歴</h1>

    <!-- 履歴が空、またはデータ自体が渡されなかった(null)場合 -->
    <p class="history-empty"
       th:if="${historyRows == null || #lists.isEmpty(historyRows)}">
      購入履歴はまだありません。
    </p>

    <!-- 履歴が存在する場合 -->
    <table class="history-table"
           th:unless="${historyRows == null || #lists.isEmpty(historyRows)}">
      <thead>
        <tr>
          <th class="col-order-id">注文番号</th>
          <th class="col-date">注文日時</th>
          <th class="col-name">商品名</th>
          <th class="col-price">単価</th>
          <th class="col-qty">数量</th>
          <th class="col-subtotal">小計</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${historyRows}">
          <td class="col-order-id" th:text="${row.orderId}">注文番号</td>
          <td class="col-date"     th:text="${#temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm')}">注文日時</td>
          <td class="col-name"     th:text="${row.productName}">商品名</td>
          <td class="col-price"    th:text="${#numbers.formatInteger(row.price, 3, 'COMMA')} + '円'">単価</td>
          <td class="col-qty"      th:text="${row.quantity}">数量</td>
          <td class="col-subtotal" th:text="${#numbers.formatInteger(row.subtotal, 3, 'COMMA')} + '円'">小計</td>
        </tr>
      </tbody>
    </table>

  </main>
</body>
</html>
