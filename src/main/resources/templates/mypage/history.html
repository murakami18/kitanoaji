<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>注文履歴</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/history.css}">
</head>
<body>
  <header th:replace="layout/_header :: header"></header>

  <main class="main-content">

    <h1 class="history-title">注文履歴</h1>

    <p class="history-empty"
       th:if="${historyRows == null || #lists.isEmpty(historyRows)}">
      購入履歴はまだありません。
    </p>

    <table class="history-table"
           th:unless="${historyRows == null || #lists.isEmpty(historyRows)}">
      <thead>
        <tr>
          <th class="col-order-id">注文番号</th>
          <th class="col-date">注文日時</th>
          <th class="col-name">商品名</th>
          <th class="col-price">単価</th>
          <th class="col-qty">数量</th>
          <th class="col-subtotal">小計</th>  <!-- 🌟 合計金額列を削除 -->
        </tr>
      </thead>
      <tbody>
        <th:block th:each="row, iterStat : ${historyRows}">

          <tr>
            <td class="col-order-id"
                th:text="${(iterStat.first || historyRows[iterStat.index - 1].orderId != row.orderId) ? row.orderId : ''}">
            </td>
            <td class="col-date"
                th:text="${(iterStat.first || historyRows[iterStat.index - 1].orderId != row.orderId) ? #temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm') : ''}">
            </td>
            <td class="col-name"     th:text="${row.productName}">商品名</td>
            <td class="col-price"    th:text="${#numbers.formatInteger(row.price, 3, 'COMMA')} + '円'">単価</td>
            <td class="col-qty"      th:text="${row.quantity}">数量</td>
            <td class="col-subtotal" th:text="${#numbers.formatInteger(row.subtotal, 3, 'COMMA')} + '円'">小計</td>
          </tr>

          <!-- 🌟 合計行：colspan="6" で全列を使い「合計金額：〇〇円」と表示 -->
          <tr class="total-row"
              th:if="${iterStat.last || historyRows[iterStat.index + 1].orderId != row.orderId}">
            <td colspan="6" class="total-label"
                th:text="'合計金額：' + ${#numbers.formatInteger(row.totalAmount, 3, 'COMMA')} + '円'">
            </td>
          </tr>

        </th:block>
      </tbody>
    </table>

  </main>
</body>
</html>
