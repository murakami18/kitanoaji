<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>商品詳細｜北ノ味</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/product_detail.css}">
</head> head>

<body>

	<div th:replace="~{layout/_header :: header}"></div>

	<main class="main-content">

		<div class="product-page">
			<h2 class="section-title">商品詳細</h2>

			<div class="product-area">

				<div class="product-image">
					<div class="thumb">
						<img th:src="@{/image/{id}.jpg(id=${product.id})}" th:alt="${product.name}"
							onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
						<span class="no-image">No Image</span>
					</div>
				</div>

				<div class="product-info">

					<div class="product-name" th:text="${product.name}">商品名</div>

					<div class="product-price" th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}">¥0
					</div>

					<a class="btn btn-secondary btn-compare" th:href="@{/product/compare(id=${product.id})}">商品比較</a>

					<div class="product-detail">
						<span class="detail-label">カテゴリー</span>
						<span class="detail-value" th:text="${product.categoryName}"></span>
					</div>

					<div class="product-detail">
						<span class="detail-label">地域</span>
						<span class="detail-value" th:text="${product.regionName}"></span>
					</div>

					<div class="product-detail">
						<span class="detail-label">内容量</span>
						<span class="detail-value">
							<span th:text="${#numbers.formatInteger(product.weight, 1, 'COMMA')}"></span> g
						</span>
					</div>

					<!-- カート追加フォームの開始 -->
					<form th:action="@{/cart/add}" method="post">
						<input type="hidden" name="productId" th:value="${product.id}" />

						<!-- 数量変更エリアをform内に移動し、name="quantity" を追加 -->
						<div class="quantity-area">
							<button type="button" class="quantity-btn" onclick="decreaseQuantity()">－</button>
							<input type="text" id="quantity" name="quantity" class="quantity-input" value="1" readonly>
							<button type="button" class="quantity-btn" onclick="increaseQuantity()">＋</button>
						</div>

						<div class="button-area">
						    <div class="btn-row-primary">
						        <button type="submit" class="btn btn-secondary">カートに追加</button>
						        <button type="submit" class="btn btn-primary" th:formaction="@{/purchase/add}">購入する</button>
						    </div>
						</div>
					</form>
					<!-- カート追加フォームの終了 -->

				</div>

			</div>

			<div class="product-footer">
				<a th:href="@{/home}" class="product-back-link">
					<span class="arrow">←</span>
					ホームに戻る
				</a>
			</div>

		</div>

	</main>

	<script>
		function increaseQuantity() {
			const q = document.getElementById("quantity");
			q.value = parseInt(q.value) + 1;
		}

		function decreaseQuantity() {
			const q = document.getElementById("quantity");
			if (parseInt(q.value) > 1) q.value = parseInt(q.value) - 1;
		}
	</script>

</body>

</html>
