<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細｜北ノ味</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    /* 商品詳細固有スタイル */
    .product-area {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .product-image {
      width: 400px;
      flex-shrink: 0;
    }

    .product-image .thumb {
      position: relative;
    }

    .product-image img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .product-price {
      font-size: 28px;
      color: #c0392b;
      margin-bottom: 20px;
    }

    .product-detail {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 30px;
    }

    .quantity-btn {
      width: 40px;
      height: 40px;
      font-size: 20px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .quantity-input {
      width: 60px;
      height: 38px;
      text-align: center;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .button-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー（layout/_header.html のフラグメントを読み込み） -->
  <div th:replace="~{layout/_header :: header}"></div>

  <main class="main-content">

    <h2 class="section-title">商品詳細</h2>

    <div class="product-area">

      <!-- 商品画像 -->
      <div class="product-image">
        <div class="thumb">
          <img
            th:src="@{/image/{id}.jpg(id=${product.id})}"
            th:alt="${product.name}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <span class="no-image">No Image</span>
        </div>
      </div>

      <!-- 商品情報 -->
      <div class="product-info">

        <!-- 商品名 -->
        <div class="product-name" th:text="${product.name}">商品名</div>

        <!-- 価格 -->
        <div class="product-price"
             th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}">¥0</div>

        <!-- カテゴリー -->
        <div class="product-detail">
          カテゴリー：<span th:text="${product.categoryName}"></span>
        </div>

        <!-- 地域 -->
        <div class="product-detail">
          地域：<span th:text="${product.regionName}"></span>
        </div>

        <!-- 内容量 -->
        <div class="product-detail">
          内容量：
          <span th:text="${#numbers.formatInteger(product.weight, 1, 'COMMA')}"></span> g
        </div>

        <!-- 数量 -->
        <div class="quantity-area">
          <button type="button" class="quantity-btn" onclick="decreaseQuantity()">－</button>
          <input type="text" id="quantity" class="quantity-input" value="1">
          <button type="button" class="quantity-btn" onclick="increaseQuantity()">＋</button>
        </div>

        <!-- ボタン -->
        <div class="button-area">

          <!-- 商品比較 -->
          <a class="btn btn-secondary" th:href="@{/product/compare}">商品比較</a>

          <!-- カート追加 -->
          <form th:action="@{/cart/add}" method="post" style="display:inline">
            <input type="hidden" name="productId" th:value="${product.id}" />
            <button type="submit" class="btn btn-primary">カートに追加</button>
          </form>

          <!-- 購入 -->
          <a class="btn btn-primary" th:href="@{/order/confirm}">購入する</a>

        </div>

      </div>

    </div>

  </main>

  <script>
    function increaseQuantity() {
      const q = document.getElementById("quantity");
      q.value = parseInt(q.value) + 1;
    }

    function decreaseQuantity() {
      const q = document.getElementById("quantity");
      if (parseInt(q.value) > 1) q.value = parseInt(q.value) - 1;
    }
  </script>

</body>
</html>
