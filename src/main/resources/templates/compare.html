<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商品比較 | 北ノ味</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/compare.css}">
</head>
<body>

  <div th:replace="~{layout/_header :: header}"></div>

  <main class="main-content">
    <div class="compare-page" th:if="${compareList != null && !compareList.empty}">

      <div class="compare-header">
        <h1 class="compare-title">商品比較</h1>
      </div>

      <div class="compare-meta">
        <span class="compare-badge">
          <span class="badge-label">カテゴリ</span>
          <span th:text="${categoryName}">カテゴリ名</span>
        </span>
      </div>

      <div class="compare-table-wrapper">
        <table class="compare-table">
          <thead>
            <tr>
              <th class="label-col"></th>
              <th th:each="p, iter : ${compareList}"
                  th:classappend="${iter.index == 0} ? 'product-col product-col--base' : 'product-col'">
                
                <div class="compare-product-thumb">
                  <span th:if="${iter.index == 0}" class="compare-base-label">選択中</span>
                  <div class="no-image">No Image</div>
                </div>
                
                <p class="compare-product-name" th:text="${p.name}">商品名</p>

                <div class="compare-action-area">
                  <a th:if="${iter.index != 0}" 
                     th:href="@{/product/{id}(id=${p.id})}" 
                     class="compare-btn-detail">
                    商品詳細
                  </a>
                  <div th:if="${iter.index == 0}" class="compare-btn-placeholder"></div>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th class="label-col">価格</th>
              <td th:each="p, iter : ${compareList}"
                  th:classappend="${iter.index == 0} ? 'product-col product-col--base' : 'product-col'">
                <span class="compare-price">
                  <span th:text="${#numbers.formatInteger(p.price, 1, 'COMMA')}">0</span>
                  <span class="unit">円</span>
                </span>
              </td>
            </tr>
            <tr>
              <th class="label-col">内容量</th>
              <td th:each="p, iter : ${compareList}"
                  th:classappend="${iter.index == 0} ? 'product-col product-col--base' : 'product-col'">
                <span class="compare-weight">
                  <span th:text="${p.weight}">0</span>
                  <span class="unit">g</span>
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="compare-footer">
        <a th:href="@{/product/{id}(id=${compareList[0].id})}" class="compare-back-link">
          <span class="arrow">←</span>
          商品詳細に戻る
        </a>
      </div>

    </div>
    
    <div class="compare-page" th:unless="${compareList != null && !compareList.empty}">
      <p>比較する商品が選択されていません。<a th:href="@{/home}">ホームへ戻る</a></p>
    </div>
  </main>

</body>
</html>
