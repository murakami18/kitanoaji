<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>購入確認</title>

<style>

body{
	background:#fff8f0;
	font-family:sans-serif;
	text-align:center;
	padding-top:100px;
}

.box{
	width:500px;
	margin:auto;
	background:white;
	padding:40px;
	border-radius:20px;
	box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
	color:#ff6600;
	margin-bottom:30px;
}

.button{
	display:inline-block;
	padding:15px 40px;
	background:#ff6600;
	color:white;
	text-decoration:none;
	border-radius:10px;
	font-size:20px;
	font-weight:bold;
}

.button:hover{
	background:#e65c00;
}

</style>

</head>
<body>

<div class="box">

	<h1>
		購入確認画面
	</h1>

	<p>
		ご注文内容を確認してください
	</p>

	<br>

	<a th:href="@{/home}" class="button">
		HOMEへ戻る
	</a>

</div>

</body>
</html>
