<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head><title>fragment</title></head>
<body>

<div th:fragment="header">

  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">メニュー</span>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-body">
      
      <section class="sidebar-section">
        <h4 class="sidebar-section-title">カテゴリ</h4>
        </section>
      
      <section class="sidebar-section">
        <div class="sidebar-section-header" onclick="toggleRegionAccordion()">
          <h4 class="sidebar-section-title">地域</h4>
          <button type="button" class="accordion-toggle-btn" id="region-chevron">▼</button>
        </div>
        
        <div class="sidebar-accordion-content" id="region-accordion">
          <ul class="region-list">
            <th:block th:if="${regions != null}">
              <th:block th:each="region : ${regions}">
                <li>
                  <a th:href="@{/home(regionId=${region.id})}" 
                     th:text="${region.name}" 
                     class="region-link">地域名</a>
                </li>
              </th:block>
            </th:block>
            
            <th:block th:if="${regions == null}">
              <li><a th:href="@{/home(regionId=1)}" class="region-link">石狩</a></li>
              <li><a th:href="@{/home(regionId=2)}" class="region-link">胆振</a></li>
              <li><a th:href="@{/home(regionId=3)}" class="region-link">渡島</a></li>
              <li><a th:href="@{/home(regionId=4)}" class="region-link">オホーツク</a></li>
              <li><a th:href="@{/home(regionId=5)}" class="region-link">上川</a></li>
              <li><a th:href="@{/home(regionId=6)}" class="region-link">釧路</a></li>
              <li><a th:href="@{/home(regionId=7)}" class="region-link">後志</a></li>
              <li><a th:href="@{/home(regionId=8)}" class="region-link">宗谷</a></li>
              <li><a th:href="@{/home(regionId=9)}" class="region-link">空知</a></li>
              <li><a th:href="@{/home(regionId=10)}" class="region-link">十勝</a></li>
              <li><a th:href="@{/home(regionId=11)}" class="region-link">根室</a></li>
              <li><a th:href="@{/home(regionId=12)}" class="region-link">日高</a></li>
              <li><a th:href="@{/home(regionId=13)}" class="region-link">檜山</a></li>
              <li><a th:href="@{/home(regionId=14)}" class="region-link">留萌</a></li>
            </th:block>
          </ul>
        </div>
      </section>

    </div>
  </aside>

  <header class="site-header">
    <div class="header-left">
      <button class="hamburger-btn" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="header-center">
      <a th:href="@{/home}" class="site-logo">北ノ味</a>
    </div>
    <nav class="header-right">
      <a th:href="@{/mypage}" class="nav-link">マイページ</a>
      <a th:href="@{/cart}"   class="nav-link">カート</a>
      <a th:href="@{/map}"    class="nav-link">マップ</a>
      <a th:href="@{/search}" class="nav-link nav-link--search">検索</a>
    </nav>
  </header>

  <script>
    // サイドバー全体の開閉
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
      document.body.classList.toggle('sidebar-open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
      document.body.classList.remove('sidebar-open');
    }

    // 地域アコーディオンの開閉
    function toggleRegionAccordion() {
      const content = document.getElementById('region-accordion');
      const chevron = document.getElementById('region-chevron');
      content.classList.toggle('open');
      chevron.classList.toggle('rotated');
    }
  </script>

</div>

</body>
</html>
