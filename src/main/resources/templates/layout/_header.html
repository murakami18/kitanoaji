<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head><title>fragment</title></head>
<body>

<!--
  =====================================================================
  共通ヘッダーフラグメント
  配置先: src/main/resources/templates/layout/_header.html
  使い方: <div th:replace="~{layout/_header :: header}"></div>
  =====================================================================
-->
<div th:fragment="header">

  <!-- サイドバーオーバーレイ -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- サイドバーメニュー -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">メニュー</span>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-body">
      <section class="sidebar-section">
        <h4 class="sidebar-section-title">カテゴリ</h4>
        <!-- 今後追加 -->
      </section>
      <section class="sidebar-section">
        <h4 class="sidebar-section-title">地域</h4>
        <!-- 今後追加 -->
      </section>
    </div>
  </aside>

  <!-- ヘッダー本体 -->
  <header class="site-header">
    <div class="header-left">
      <button class="hamburger-btn" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="header-center">
      <a th:href="@{/home}" class="site-logo">北ノ味</a>
    </div>
    <nav class="header-right">
      <a th:href="@{/mypage}" class="nav-link">マイページ</a>
      <a th:href="@{/cart}"   class="nav-link">カート</a>
      <a th:href="@{/map}"    class="nav-link">マップ</a>
      <a th:href="@{/search}" class="nav-link nav-link--search">検索</a>
    </nav>
  </header>

  <!-- サイドバー制御スクリプト -->
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
      document.body.classList.toggle('sidebar-open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
      document.body.classList.remove('sidebar-open');
    }
  </script>

</div>

</body>
</html>
