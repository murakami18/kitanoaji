<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>登録内容の確認</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/register.css}" />
  <link rel="stylesheet" th:href="@{/css/confirm.css}" />
</head>

<body>
  <header th:replace="layout/_header :: header"></header>

  <main class="main-content register-page">
    <h1 class="confirm-title">入力情報の確認</h1>

    <div class="register-card">
      <p class="confirm-instruction">以下の内容で登録します。よろしければ「確定する」ボタンを押してください。</p>

      <!-- 確認テーブル -->
      <table class="confirm-table">
        <tr>
          <th>名前</th>
          <td th:text="${form.name}"></td>
        </tr>
        <tr>
          <th>メールアドレス</th>
          <td th:text="${form.email}"></td>
        </tr>
        <tr>
          <th>パスワード</th>
          <td class="masked">••••••••</td>
        </tr>
        <tr>
          <th>気になる地域</th>
          <td th:text="${form.regionId != null && regionMap.containsKey(form.regionId)} ? ${regionMap[form.regionId]} : '選択なし'"></td>
        </tr>
        <tr>
          <th>好きなカテゴリー</th>
          <td th:text="${form.categoryId != null && categoryMap.containsKey(form.categoryId)} ? ${categoryMap[form.categoryId]} : '選択なし'"></td>
        </tr>
      </table>

      <!-- 本番登録処理フォーム -->
      <form th:action="@{/register}" th:object="${form}" method="post">

        <input type="hidden" th:field="*{name}" />
        <input type="hidden" th:field="*{email}" />
        <input type="hidden" th:field="*{emailConfirm}" />
        <input type="hidden" th:field="*{password}" />
        <input type="hidden" th:field="*{regionId}" />
        <input type="hidden" th:field="*{categoryId}" />

        <div class="confirm-actions">
          <button type="button" class="btn-back" onclick="history.back()">修正する</button>
          <button type="submit" class="btn-submit">確定する</button>
        </div>

      </form>
    </div>
  </main>
</body>

</html>
