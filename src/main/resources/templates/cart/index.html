<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8" />
	<title>カート - 北ノ味</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
	<header th:replace="~{layout/_header :: header}"></header>

	<main>
		<h1>カート</h1>

		<th:block th:if="${#lists.isEmpty(cart)}">
			<div class="cart-empty">
				<p>カートに商品が入っていません。</p>
				<a href="/home" class="back-link" style="margin-top: 15px; display: inline-block;">▶ 商品一覧に戻る</a>
			</div>
		</th:block>

		<th:block th:unless="${#lists.isEmpty(cart)}">
			<div class="table-wrapper">
				<table>
					<thead>
						<tr>
							<th>商品名</th>
							<th>単価</th>
							<th>数量</th>
							<th>小計</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item : ${cart}">
							<td>[[${item.name}]]</td>
							<td>[[${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}]]円</td>
							<td>[[${item.quantity}]]</td>
							<td>[[${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}]]円</td>
							<td>
								<form th:action="@{/cart/remove}" method="post" class="nav-form">
									<input type="hidden" name="productId" th:value="${item.productId}" />
									<button type="submit">削除</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>

				<div class="total-box">
					<span>合計金額</span>
					<strong>[[${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}]]円</strong>
				</div>
			</div>

			<div class="cart-actions">
				<a href="/home" class="back-link">▶ 商品一覧に戻る</a>
				<form th:action="@{/purchase}" method="post" class="nav-form">
					<button type="submit" class="btn-purchase">購入する</button>
				</form>
			</div>
		</th:block>
	</main>

</body>

</html>
