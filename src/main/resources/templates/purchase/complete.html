<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>注文完了</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/complete.css}">
</head>

<body>
  <div th:replace="~{layout/_header :: header}"></div>
  <main class="main-content">
    <div class="complete-wrapper">
      <div class="complete-card">

        <div class="complete-icon">✓</div>

        <h1>ご注文ありがとうございます！</h1>

        <p class="complete-order-id">
          注文番号：<span th:text="${orderId}"></span>
        </p>

        <p class="complete-message">
          ご登録のメールアドレスに注文情報をお送りしております。<br>
          ご確認ください。
        </p>

        <a href="/home" class="complete-back-btn">
          ← 商品一覧に戻る
        </a>

      </div>
    </div>
  </main>
</body>
</html>
